<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bàn phím Telex tổ ong</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.k:active{filter:brightness(0.86)}
.chip:active{filter:brightness(0.9)}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F6F7F9; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #15191E; overflow: hidden">
<div style="flex: 1 1 auto; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.01em">Telex tổ ong</h1>
<p style="margin: 0; font-size: 14px; color: #4A5560">{{subtitle}}</p>
<div aria-live="polite" style="flex: 1 1 auto; min-height: 120px; background: #FFFFFF; border-radius: 16px; padding: 16px; font-size: 20px; line-height: 1.5; overflow: auto; word-break: break-word; box-shadow: 0 1px 2px rgba(20,25,30,0.08)">
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ true }}">
<span style="color: #5B6670">Thử gõ: tieengs vieetj → tiếng việt</span>
</sc-if>
<span style="white-space: pre-wrap">{{text}}</span><span style="text-decoration: underline; text-underline-offset: 4px">{{composing}}</span><span style="display: inline-block; width: 2px; height: 22px; background: #15191E; vertical-align: -3px; margin-left: 1px"></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: #2B3138">
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFFFFF; border: 1px solid #B9C2CC"></span>Phụ âm</div>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #DCE8FB; border: 1px solid #9DB8E6"></span>Nguyên âm + W</div>
<div style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFE2CC; border: 1px solid #E8B48C"></span>Dấu thanh</div>
</div>
</div>
<div style="flex: 0 0 325px; background: #DDE2E8; display: flex; flex-direction: column">
<sc-if value="{{showBar}}" hint-placeholder-val="{{ false }}">
<div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px">
<div style="flex: 1 1 auto; display: flex; gap: 6px; overflow-x: auto; align-items: center; min-width: 0">
<sc-if value="{{hasVowel}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button class="chip" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</sc-if>
<sc-if value="{{noVowel}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; color: #4A5560">Gõ nguyên âm để đổi dấu nhanh ở đây</span>
</sc-if>
</div>
<sc-if value="{{showBarBack}}" hint-placeholder-val="{{ true }}">
<button aria-label="Xoá" onClick="{{back}}" class="chip" style="flex: 0 0 44px; height: 40px; border: 0; border-radius: 10px; background: #B9C2CC; color: #1F262E; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-5 6"></path><path d="M12 9l5 6"></path></svg>
</button>
</sc-if>
</div>
</sc-if>
<div style="{{gridStyle}}">
<sc-if value="{{wide}}" hint-placeholder-val="{{ true }}">
<div style="{{chipBoxStyle}}">
<sc-if value="{{hasVowel}}" hint-placeholder-val="{{ false }}">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button class="chip" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</sc-if>
<sc-if value="{{noVowel}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 13px; color: #4A5560; line-height: 1.3">Gõ nguyên âm để đổi dấu nhanh ở đây</span>
</sc-if>
</div>
</sc-if>
<sc-if value="{{noPanel}}" hint-placeholder-val="{{ true }}">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="28">
<button class="k" onClick="{{k.click}}" onPointerDown="{{k.down}}" onPointerUp="{{k.up}}" aria-label="{{k.aria}}" style="{{k.style}}">
<sc-if value="{{k.hasHint}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 9px; font-weight: 500; line-height: 1; color: #4A5560; margin-bottom: 2px">{{k.hint}}</span>
</sc-if>
<span style="{{k.labelStyle}}">{{k.label}}</span>
<sc-if value="{{k.isEmoji}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path></svg>
</sc-if>
<sc-if value="{{k.isSet}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</sc-if>
<sc-if value="{{k.isEnter}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 5v7H6"></path><path d="M10 8l-4 4 4 4"></path></svg>
</sc-if>
<sc-if value="{{k.isBack}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-5 6"></path><path d="M12 9l5 6"></path></svg>
</sc-if>
<sc-if value="{{k.hasSub}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; font-weight: 600; line-height: 1; margin-top: 2px">{{k.sub}}</span>
</sc-if>
</button>
</sc-for>
</sc-if>
<sc-if value="{{panel}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; display: flex; flex-direction: column">
<div style="height: 40px; flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 14px; color: #2B3138">
<span style="font-weight: 600">{{panelTitle}}</span>
<sc-if value="{{picking}}" hint-placeholder-val="{{ false }}">
<button onClick="{{cancelPick}}" style="border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #0A3A80; padding: 8px; cursor: pointer">Huỷ</button>
</sc-if>
</div>
<div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 6px; display: grid; grid-template-columns: repeat(8, 1fr); align-content: start; gap: 2px">
<sc-for list="{{emojiList}}" as="e" hint-placeholder-count="40">
<button class="chip" onClick="{{e.pick}}" aria-label="{{e.ch}}" style="height: 44px; border: 0; border-radius: 10px; background: transparent; color: #15191E; font-family: inherit; font-size: 26px; line-height: 1; padding: 0; cursor: pointer">{{e.ch}}</button>
</sc-for>
<sc-if value="{{emptyList}}" hint-placeholder-val="{{ false }}">
<span style="grid-column: 1 / -1; font-size: 13px; color: #4A5560; padding: 12px 6px">Chưa có emoji nào dùng gần đây</span>
</sc-if>
</div>
<div style="height: 52px; flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-top: 1px solid #C5CCD3">
<button onClick="{{closePanel}}" class="chip" style="flex: 0 0 52px; height: 38px; border: 0; border-radius: 10px; background: #B9C2CC; color: #1F262E; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0">ABC</button>
<div style="flex: 1 1 auto; display: flex; justify-content: space-around; min-width: 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<button onClick="{{t.pick}}" aria-label="{{t.name}}" style="{{t.style}}">
<sc-if value="{{t.isRecent}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></sc-if>
<sc-if value="{{t.isFace}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><path d="M9 9h.01"></path><path d="M15 9h.01"></path></svg></sc-if>
<sc-if value="{{t.isHand}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg></sc-if>
<sc-if value="{{t.isHeart}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg></sc-if>
<sc-if value="{{t.isObj}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l3.1 6.3 6.9 1-5 4.8 1.2 6.9L12 17.8 5.8 21 7 14.1 2 9.3l6.9-1z"></path></svg></sc-if>
<sc-if value="{{t.isSym}}" hint-placeholder-val="{{ false }}"><span>#1</span></sc-if>
</button>
</sc-for>
</div>
<button aria-label="Xoá" onClick="{{back}}" class="chip" style="flex: 0 0 48px; height: 38px; border: 0; border-radius: 10px; background: #B9C2CC; color: #1F262E; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-5 6"></path><path d="M12 9l5 6"></path></svg>
</button>
</div>
</div>
</sc-if>
</div>
<div style="flex: 1 1 auto"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;qwerty-7&quot;,&quot;zigzag&quot;,&quot;qwerty-wide&quot;,&quot;qwerty&quot;,&quot;telex&quot;],&quot;default&quot;:&quot;qwerty-7&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;fieldType&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;phone&quot;],&quot;default&quot;:&quot;text&quot;,&quot;section&quot;:&quot;Ô nhập&quot;},&quot;toneStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;old&quot;,&quot;new&quot;],&quot;default&quot;:&quot;old&quot;,&quot;section&quot;:&quot;Telex&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  vIdx(word) {
    var V = 'aăâeêioôơuưy';
    var out = [];
    for (var i = 0; i < word.length; i++) {
      var ch = word[i];
      if (V.indexOf(ch) < 0) continue;
      if (ch === 'u' && i > 0 && word[i - 1] === 'q') continue;
      if (ch === 'i' && i === 1 && word[0] === 'g' && word.length > 2 && V.indexOf(word[2]) >= 0) continue;
      out.push(i);
    }
    return out;
  }
  toneIndex(word) {
    var idx = this.vIdx(word);
    if (!idx.length) return -1;
    var mods = idx.filter(function (i) { return 'ăâêôơư'.indexOf(word[i]) >= 0; });
    if (mods.length) return mods[mods.length - 1];
    if (idx.length >= 3) return idx[1];
    if (idx.length === 2) {
      var hasFinal = idx[1] < word.length - 1;
      if (hasFinal) return idx[1];
      var pair = word[idx[0]] + word[idx[1]];
      if ((this.props.toneStyle || 'old') === 'new' && (pair === 'oa' || pair === 'oe' || pair === 'uy')) return idx[1];
      return idx[0];
    }
    return idx[0];
  }
  spell(word, tone, caps) {
    var T = { 'a': 'aáàảãạ', 'ă': 'ăắằẳẵặ', 'â': 'âấầẩẫậ', 'e': 'eéèẻẽẹ', 'ê': 'êếềểễệ', 'i': 'iíìỉĩị', 'o': 'oóòỏõọ', 'ô': 'ôốồổỗộ', 'ơ': 'ơớờởỡợ', 'u': 'uúùủũụ', 'ư': 'ưứừửữự', 'y': 'yýỳỷỹỵ' };
    var chars = word.slice();
    if (tone > 0) {
      var i = this.toneIndex(chars);
      if (i >= 0 && T[chars[i]]) chars[i] = Array.from(T[chars[i]])[tone];
    }
    var cp = caps || [];
    return chars.map(function (ch, n) { return cp[n] ? ch.toUpperCase() : ch; }).join('');
  }
  press(k, up) {
    var st = this.state || {};
    var word = (st.word || []).slice();
    var caps = (st.caps || []).slice();
    var tone = st.tone || 0;
    var hasV = this.vIdx(word).length > 0;
    var i;
    function add(ch) { word.push(ch); caps.push(!!up); }
    var tv = this.toneOf(k);
    if (tv >= 1 && tv <= 5 && hasV) {
      if (tone === tv) { tone = 0; add(k); } else { tone = tv; }
    } else if (tv === 6 && hasV && tone > 0) {
      tone = 0;
    } else if ('aeo'.indexOf(k) >= 0) {
      var c = { a: 'â', e: 'ê', o: 'ô' }[k];
      var j = -1;
      for (i = word.length - 1; i >= 0; i--) { if (word[i] === k || word[i] === c) { j = i; break; } }
      if (j >= 0 && word[j] === k) word[j] = c;
      else if (j >= 0 && word[j] === c) { word[j] = k; add(k); }
      else add(k);
    } else if (k === 'd') {
      if (word[0] === 'd') word[0] = 'đ';
      else if (word[0] === 'đ') { word[0] = 'd'; add('d'); }
      else add('d');
    } else if (k === 'w') {
      var s = word.join('');
      var p = s.lastIndexOf('uo');
      if (p >= 0 && !(p > 0 && word[p - 1] === 'q')) { word[p] = 'ư'; word[p + 1] = 'ơ'; }
      else {
        var done = false;
        for (i = word.length - 1; i >= 0; i--) {
          var m = { a: 'ă', o: 'ơ', u: 'ư' }[word[i]];
          if (m && !(word[i] === 'u' && i > 0 && word[i - 1] === 'q')) { word[i] = m; done = true; break; }
          var r = { 'ă': 'a', 'ơ': 'o', 'ư': 'u' }[word[i]];
          if (r) { word[i] = r; add('w'); done = true; break; }
        }
        if (!done) add('ư');
      }
    } else {
      add(k);
    }
    this.setState({ word: word, caps: caps, tone: tone });
  }
  space() {
    var st = this.state || {};
    this.setState({ text: (st.text || '') + this.spell(st.word || [], st.tone || 0, st.caps) + ' ', word: [], caps: [], tone: 0 });
  }
  back() {
    this.deleteN(1);
  }
  deleteN(n) {
    var st = this.state || {};
    var word = (st.word || []).slice();
    var caps = (st.caps || []).slice();
    var tone = st.tone || 0;
    var text = (typeof Intl !== 'undefined' && Intl.Segmenter) ? Array.from(new Intl.Segmenter().segment(st.text || ''), function (x) { return x.segment; }) : Array.from(st.text || '');
    for (var i = 0; i < n; i++) {
      if (word.length) { word.pop(); caps.pop(); if (!this.vIdx(word).length) tone = 0; }
      else if (text.length) text.pop();
    }
    this.setState({ word: word, caps: caps, tone: tone, text: text.join('') });
  }
  punct(ch) {
    var st = this.state || {};
    this.setState({ text: (st.text || '') + this.spell(st.word || [], st.tone || 0, st.caps) + ch, word: [], caps: [], tone: 0 });
  }
  maps() {
    return {
      C: { q: '1', w: '2', e: '3', r: '4', t: '5', y: '6', u: '7', i: '8', o: '9', p: '0', a: '😄', s: '😂', d: '😍', f: '👍', g: '🙏', h: '❤️', j: '😭', k: '🔥', l: '🎉', z: '@', x: '#', c: '&', v: '-', b: '/', n: '(', m: ')', ',': '?', '.': '!' }
    };
  }
  cats() {
    return {
      face: '😀 😃 😄 😁 😆 😅 🤣 😂 🙂 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😋 😛 😜 🤪 😝 🤗 🤭 🤔 🤐 😐 😑 😶 😏 😒 🙄 😬 😌 😔 😪 😴 😷 🤒 🤕 🥵 🥶 😵 🤯 🥳 😎 🤓 😕 😟 🙁 😮 😲 😳 🥺 😢 😭 😱 😖 😣 😞 😓 😩 😫 😤 😡 😠 🤬'.split(' '),
      hand: '👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 👏 🙌 👐 🤲 🙏 🤝 💪 ✍️ 💅 🤳'.split(' '),
      heart: '❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 😻 💋 🌹'.split(' '),
      obj: '🎉 🎊 🎁 🎂 🔥 ✨ ⭐ 🌟 💯 ✅ ❌ ⚡ ☀️ 🌙 🌈 ☕ 🍜 🍚 🍺 ⚽ 🏸 🎵 📷 📱 💻 🚗 🏍️ ✈️ 🏠 💡 📌 🎈'.split(' '),
      sym: '1 2 3 4 5 6 7 8 9 0 @ # & * - + = ( ) _ $ % " \' : ; / ! ? ~'.split(' ')
    };
  }
  toneOf(k) {
    return { s: 1, f: 2, l: 2, r: 3, x: 4, j: 5, z: 6 }[k] || 0;
  }
  customOf(k) {
    var cu = (this.state || {}).custom || {};
    if (cu[k] !== undefined) return cu[k];
    return this.maps().C[k];
  }
  pickEmoji(ch) {
    var st = this.state || {};
    if (st.pickFor) {
      var custom = Object.assign({}, st.custom || {});
      custom[st.pickFor] = ch;
      this.setState({ custom: custom, pickFor: null, assign: false, mode: 'abc' });
      return;
    }
    var recent = [ch].concat((st.recent || []).filter(function (x) { return x !== ch; })).slice(0, 32);
    this.punct(ch);
    this.setState({ recent: recent });
  }
  deleteWords(n) {
    var st = this.state || {};
    var text = (typeof Intl !== 'undefined' && Intl.Segmenter) ? Array.from(new Intl.Segmenter().segment(st.text || ''), function (x) { return x.segment; }) : Array.from(st.text || '');
    var left = Math.max(1, n);
    if ((st.word || []).length) left--;
    for (var i = 0; i < left; i++) {
      while (text.length && /\s/.test(text[text.length - 1])) text.pop();
      while (text.length && !/\s/.test(text[text.length - 1])) text.pop();
    }
    this.setState({ word: [], caps: [], tone: 0, text: text.join('') });
  }
  curMode() {
    var st = this.state || {};
    return st.mode || ((this.props.fieldType || 'text') === 'phone' ? 'dial' : 'abc');
  }
  dialSub() {
    return { '1': '(', '2': ')', '3': '/', '4': '*', '5': '#', '6': '-', '7': ';', '8': ':', '9': '=', '0': '+', '.': ',' };
  }
  gesture(act, dx, dy, dt) {
    var st = this.state || {};
