name: iOS

# Pushes to main as well as pull requests: changes usually land on main directly, and dev-build
# only tests Android.
on:
  push:
    branches: [main]
    # Shared engine, dictionaries and Gradle build, minus files CI never builds or runs.
    paths: &paths ['ios/**', 'telex/**', 'app/src/main/assets/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'gradlew',
            '.github/workflows/ios.yml',
            '!**.md', '!ios/docs/**', '!ios/scripts/asc_*.py', '!ios/scripts/release.sh', '!ios/scripts/render-app-icon.swift']
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Shared JVM and Native tests
        run: ./gradlew --no-daemon -PskipAndroid=true :telex:test :telex:macosArm64Test
      - name: Build Simulator app and keyboard
        run: ios/scripts/build.sh
      - name: Test native iOS behavior
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild -project ios/TeleHex.xcodeproj -scheme TeleHex \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath out/ios -parallel-testing-enabled NO \
            test -only-testing:TeleHexTests CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone release
        run: SDK=iphoneos DESTINATION='generic/platform=iOS' CONFIGURATION=Release ios/scripts/build.sh
