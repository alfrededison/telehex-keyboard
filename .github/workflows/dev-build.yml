# Every push to main that changes code replaces the "dev" prerelease with a fresh X.Y.Z-dev.N APK.
# Skipped for documentation-only pushes and for the "Start <next> development" commit that
# tools/release.sh puts right after a release tag: its code is the release itself.
name: dev-build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "prototype/**", "LICENSE", "NOTICE"]

permissions:
  contents: write

# Never cancel a run: one stopped between deleting and recreating the release would leave none.
concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  check:
    name: decide whether to build
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: appVersion must be bumped after a release
        run: |
          RELEASE=1 . tools/version.sh
          if git rev-parse -q --verify "refs/tags/v$VERSION_NAME" >/dev/null; then
            echo "v$VERSION_NAME is already released: bump appVersion (tools/release.sh does it)," \
                 "otherwise this dev build would be a downgrade from the release." >&2
            exit 1
          fi
      - name: Skip the commit right after a release tag
        id: decide
        run: |
          released=$(git tag --points-at HEAD^ --list 'v*' 2>/dev/null | head -n1)
          if [ -n "$released" ]; then
            echo "HEAD only starts the next version after $released: nothing new to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  dev:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The gh steps use GH_TOKEN; keep the write token out of .git/config while Gradle runs.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and lint
        run: |
          ./gradlew --no-daemon :telex:test :app:testDebugUnitTest :app:lintDebug
          python3 tools/test_version.py
          python3 tools/test_signing.py
          python3 tools/test_release.py
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build with the project signing key and verify its certificate
        env:
          REQUIRE_PROJECT_SIGNING: "1"
          BUILD_TOOLS: "36.0.0"
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TeleHex-dev-apk
          path: |
            out/TeleHex.apk
            out/TeleHex.apk.sha256
          if-no-files-found: error
      - name: Replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . tools/version.sh
          cp out/TeleHex.apk "out/TeleHex-$VERSION_NAME.apk"
          (cd out && sha256sum "TeleHex-$VERSION_NAME.apk" > "TeleHex-$VERSION_NAME.apk.sha256")
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev --prerelease --target "$GITHUB_SHA" \
            --title "Development build $VERSION_NAME" \
            --notes "Built from $GITHUB_SHA. Untested development build: install at your own risk." \
            "out/TeleHex-$VERSION_NAME.apk" "out/TeleHex-$VERSION_NAME.apk.sha256"
