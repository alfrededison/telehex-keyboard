# Pull requests only: on main, dev-build runs the same tests and lint before building the signed APK.
name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "fastlane/**", "tools/store/**", "tools/store_screens.py"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit tests, lint, version and signing guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Telex engine, app unit tests, lint
        run: ./gradlew --no-daemon :telex:test :app:testDebugUnitTest :app:lintDebug
      - name: Version numbering across version changes and tags
        run: python3 tools/test_version.py
      - name: Vietnamese and English n-gram pipeline
        run: python3 tools/test_ngram.py
      - name: Signing configuration and certificate guards
        run: python3 tools/test_signing.py
      - name: Release script tags the release and bumps to the next dev version
        run: python3 tools/test_release.py
      - name: Google Play release notes from CHANGELOG.md
        run: python3 tools/test_play_whatsnew.py

  build:
    name: release APK (debug key)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: BUILD_TOOLS=36.0.0 tools/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TeleHex-apk
          path: |
            out/TeleHex.apk
            out/TeleHex.apk.sha256
