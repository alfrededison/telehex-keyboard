name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew :telex:test :app:assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "telehex-${{ github.ref_name }}.apk"
      - name: Changelog from commits
        id: changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..${{ github.ref_name }}"; else range="${{ github.ref_name }}"; fi
          { echo "body<<EOF"; git log --pretty=format:'- %s' "$range"; echo; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: telehex-${{ github.ref_name }}.apk
          body: ${{ steps.changelog.outputs.body }}
