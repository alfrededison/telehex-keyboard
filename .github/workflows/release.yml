# Pushing a tag vX.Y.Z builds the release APK and opens a draft release for a maintainer to publish.
# Its notes are the CHANGELOG.md section plus the commits since the previous release, without the
# version bumps (tools/release_notes.py).
#
# With the PLAY_SERVICE_ACCOUNT_JSON secret set, the app bundle also goes to Google Play: track
# PLAY_TRACK (repository variable, default "internal") as a release with status PLAY_RELEASE_STATUS
# (default "draft", to roll out from Play Console; "completed" also works, staged statuses would need
# userFraction). Without the secret the bundle is only a workflow
# artifact. Setup: docs/play-store.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes list the commits since the previous release.
          fetch-depth: 0
          # The gh steps use GH_TOKEN; keep the write token out of .git/config while Gradle runs.
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tag must match appVersion
        run: |
          RELEASE=1 . tools/version.sh
          test "v$VERSION_NAME" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, appVersion $VERSION_NAME"; exit 1; }
      - name: Release notes from CHANGELOG.md and the commits since the previous release
        run: |
          python3 tools/release_notes.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Tests and lint
        run: |
          ./gradlew --no-daemon :telex:test :app:testDebugUnitTest :app:lintDebug
          python3 tools/test_version.py
          python3 tools/test_signing.py
          python3 tools/test_release.py
          python3 tools/test_play_whatsnew.py
      - run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Build with the project signing key and verify its certificate
        env:
          BUILD_TOOLS: "36.0.0"
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: RELEASE=1 tools/release-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TeleHex-release-apk
          path: |
            out/TeleHex.apk
            out/TeleHex.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TeleHex-release-play-bundle
          path: |
            out/TeleHex.aab
            out/mapping.txt
          if-no-files-found: error
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run after a failed Play upload keeps the draft made the first time.
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists: keeping it."
            exit 0
          fi
          cp out/TeleHex.apk "out/TeleHex-$GITHUB_REF_NAME.apk"
          (cd out && sha256sum "TeleHex-$GITHUB_REF_NAME.apk" > "TeleHex-$GITHUB_REF_NAME.apk.sha256")
          gh release create "$GITHUB_REF_NAME" --draft --title "TeleHex $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "out/TeleHex-$GITHUB_REF_NAME.apk" "out/TeleHex-$GITHUB_REF_NAME.apk.sha256"
      # A secret cannot appear in an if: expression, so this step turns its presence into an output.
      - name: Google Play upload configured?
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set: the app bundle stays a workflow artifact."
          fi
      - name: Google Play release notes from CHANGELOG.md
        if: steps.play.outputs.enabled == 'true'
        run: python3 tools/play_whatsnew.py "$GITHUB_REF_NAME" out/whatsnew
      # Pinned to the v1.1.5 commit: the action receives the Play service account key.
      - name: Upload the app bundle to Google Play
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.telehex.keyboard
          releaseFiles: out/TeleHex.aab
          releaseName: ${{ github.ref_name }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          mappingFile: out/mapping.txt
          whatsNewDirectory: out/whatsnew
